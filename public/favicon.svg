<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Karacter monogram for browser tabs: ink tile, paper K, amber on-air dot.
       The K is drawn as strokes, not text, so it looks the same whatever fonts
       the browser has. The sound bars of the full monogram are left out here:
       at 16px they blur into a smudge. -->
  <rect width="240" height="240" rx="52" fill="#16130E"/>
  <clipPath id="baseline"><rect y="62" width="240" height="114"/></clipPath>
  <path clip-path="url(#baseline)" d="M84 60V182M84 148.5L166 62M110 102L170 182" fill="none" stroke="#F6F7F5" stroke-width="30"/>
  <circle cx="180" cy="66" r="19" fill="#F2A93B"/>
</svg>
