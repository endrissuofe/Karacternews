# CI (CLAUDE.md §3.10): lint + typecheck + production build on every PR/push
# to main. Build needs a live Postgres because Next prerenders through
# Payload — provided here as a service container with migrations applied.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karacter
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: karacter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karacter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://karacter:ci@127.0.0.1:5432/karacter
      PAYLOAD_SECRET: ci-only-secret-not-used-in-prod
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      CRON_SECRET: ci-only
      PREVIEW_SECRET: ci-only

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run migrations
        run: pnpm payload migrate

      - name: Build
        run: pnpm build

  # Builds the production image here rather than on the server (ADR-0005):
  # the Oracle AMD E2.1.Micro has 1 GB RAM and cannot run `next build`.
  # The image carries no secrets — the Dockerfile is multi-stage and the
  # runner stage copies only build output, and the build-time credentials
  # below are throwaway, exactly as in the build job above.
  # Builds the image on every run so a broken Dockerfile fails the PR;
  # only a push to main logs in to GHCR and publishes it.
  publish-image:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karacter
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: karacter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karacter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://karacter:ci@127.0.0.1:5432/karacter
      PAYLOAD_SECRET: ci-only-secret-not-used-in-prod
      # Inlined into client bundles at build time, so this MUST be the real
      # public URL — not localhost. It is not a secret.
      NEXT_PUBLIC_SERVER_URL: https://karaktermedia.com

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `next build` prerenders through Payload, so the schema must exist
      # in the throwaway database before the image build runs.
      - name: Run migrations
        run: pnpm payload migrate

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; the repo name is not.
      - name: Resolve image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Plain `docker build --network=host` rather than buildx, so the build
      # container can reach the Postgres service on 127.0.0.1. The runner is
      # x86_64 and so is the AMD micro, so no cross-compilation is needed.
      - name: Build image
        run: |
          docker build \
            --network=host \
            --file infra/Dockerfile \
            --build-arg DATABASE_URL="$DATABASE_URL" \
            --build-arg PAYLOAD_SECRET="$PAYLOAD_SECRET" \
            --build-arg NEXT_PUBLIC_SERVER_URL="$NEXT_PUBLIC_SERVER_URL" \
            --tag "${{ steps.img.outputs.name }}:latest" \
            --tag "${{ steps.img.outputs.name }}:${{ github.sha }}" \
            .

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "${{ steps.img.outputs.name }}"

      - name: Report image size
        run: docker images "${{ steps.img.outputs.name }}" --format '{{.Repository}}:{{.Tag}} {{.Size}}'
